lay:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.tiles .card{padding:22px}.metric{font-size:40px;font-weight:750;letter-spacing:-2px;color:var(--blue)}details{margin:18px 0;background:white;border:1px solid var(--line);border-radius:16px;padding:16px 20px}summary{cursor:pointer;font-weight:650}details p,details ul,details ol{margin-top:16px}a{color:var(--blue)}textarea{width:100%;min-height:120px;border-radius:16px;border:1px solid var(--line);padding:16px;resize:vertical;background:white;color:var(--ink)}.order{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.order span{flex:1}.order button{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 12px}.banner{background:#e9f1fd;color:#174b80;padding:12px 24px;text-align:center;font-size:14px}.overlay{position:fixed;inset:0;background:#f5f5f7f5;z-index:10;display:grid;place-items:center;padding:24px}.overlay .card{max-width:460px;text-align:center}.hidden{display:none!important}.fade{animation:appear .3s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}footer{max-width:1080px;margin:auto;padding:0 24px 30px;font-size:12px;color:var(--muted)}.summaryrow{padding:15px 0;border-bottom:1px solid var(--line)}@media(max-width:740px){.grid{grid-template-columns:1fr;gap:24px}main{padding-top:26px}.hero-art{transform:none}.tiles{grid-template-columns:1fr}.tiles .card{display:flex;align-items:center;gap:20px}.bar{padding:10px 16px}.card{padding:22px}h1{margin-top:18px}.choice{font-size:16px}.time{gap:4px}.meta{margin-bottom:20px}.hero-art .money{font-size:42px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{header,footer,.actions,.no-print{display:none!important}body{background:white}main{padding:0;max-width:none}details{display:block}.card{break-inside:avoid}h2{font-size:28px}.tiles{grid-template-columns:repeat(3,1fr)}}

const scenarios=[{"type":"choice","chapter":"01 / Лёгкие деньги","time":"1 минута","title":"Работа или ловушка?","intro":"Ты копишь на наушники. В личные сообщения приходит предложение. Выбери действие.","person":"Артём · «менеджер»","chat":["Привет! Есть подработка после школы. Опыт не нужен.","На твою карту будут приходить платежи. Переводишь дальше — часть оставляешь себе.","Всё официально, но решить надо прямо сейчас."],"options":["Попросить фото его паспорта и согласиться, если пришлёт.","Отказаться от переводов через свою карту и обсудить сообщение со взрослым.","Попробовать один раз с небольшой суммой."],"correct":1,"good":"Ты остановил вовлечение до первого перевода.","bad":"Так можно попасть в схему: паспорт в чате и маленькая сумма не доказывают законность.","lesson":"Здесь платят за использование твоего счёта, а не за понятную работу. Дроппер — человек, через которого проводят чужие, в том числе похищенные, деньги или чей банковский доступ используют для этого. Он может быть вовлечён обманом."},{"type":"clues","chapter":"01 / Разбери переписку","time":"1 минута","title":"Найди три уловки.","intro":"Отметь ровно три фразы, которые должны насторожить. Внешне обычная деталь сама по себе не доказывает обман.","options":["«Оплата по пятницам».","«Нужна твоя карта для чужих платежей».","«Никому не рассказывай, родители не поймут».","«Ответь за две минуты, иначе место заберут».","«Общаемся в мессенджере»."],"correct":[1,2,3]},{"type":"choice","chapter":"02 / Свой человек","time":"1 минута","title":"«Ты мне не доверяешь?»","intro":"Одноклассник Дима просит выручить. Он действительно твой знакомый — но происхождение денег тебе неизвестно.","person":"Дима · одноклассник","chat":["Мой банк что-то ограничил. Давай платёж придёт тебе, а ты отправишь куда скажу?","Я уже так делал. Тебе тоже немного заплатят.","Мы же друзья. Ты мне не доверяешь?"],"options":["Помочь: Дима мой друг, значит, деньги безопасные.","Согласиться, если Дима напишет расписку.","Отказать в переводах и предложить Диме вместе обратиться в его банк."],"correct":2,"good":"Ты сохранил границу и предложил другу безопасную помощь.","bad":"Дружба и расписка не подтверждают происхождение денег и не делают операцию законной.","lesson":"Знакомый тоже может быть вовлечён. «Мы друзья» — давление на чувство вины, а не объяснение платежа. Безопасная фраза: «Я не пропускаю чужие деньги через свой счёт. Давай разберёмся с банком»."},{"type":"choice","chapter":"02 / По другую сторону экрана","time":"1 минута","title":"Чьи это деньги?","intro":"Посмотри на возможное продолжение такой схемы. Это учебная история, а не результат реального перевода.","person":"Ирина · пострадавшая","chat":["Мне написали с аккаунта знакомой и попросили срочно помочь.","Я перевела 24 000 ₽. Потом оказалось, что аккаунт взломали.","Эти деньги я откладывала на аренду квартиры."],"options":["Вреда от посредника нет: он ведь не писал Ирине.","Чужой счёт помогает увести деньги дальше. Пострадавший теряет средства, а владелец счёта рискует отвечать за своё участие.","Если комиссия маленькая, участие несущественно."],"correct":1,"good":"Ты увидел человека за цифрами на экране.","bad":"«Я только перевёл» не отменяет вреда: именно дальнейшие переводы помогают похищенным деньгам уйти.","lesson":"Дропперство плохо не только из-за наказания: оно помогает краже чужих средств. Обманутый человек заслуживает помощи, а не обвинения в доверчивости. Вопрос юридической ответственности решают по обстоятельствам и доказательствам."},{"type":"choice","chapter":"03 / Выход из схемы","time":"1 минута","title":"Деньги уже пришли.","intro":"Новый кейс: Саша уже согласился на сомнительную подработку. Помоги ему остановиться. Эта ситуация не означает, что ты согласился в прошлых заданиях.","person":"Куратор · неизвестный","chat":["Перевод у тебя. Отправь дальше по реквизитам, которые пришлю.","Если передумал, просто «верни» туда же.","Не вздумай звонить в банк. Будут проблемы."],"options":["Перевести по новым реквизитам: так быстрее выйти из схемы.","Не трогать деньги, прекратить общение по существу операций и самостоятельно связаться со своим банком.","Удалить чат и никому не говорить."],"correct":1,"good":"Ты прекратил движение денег и выбрал проверенный канал помощи.","bad":"Перевод по указанию незнакомца продолжает схему, а удаление чата уничтожает полезные доказательства.","lesson":"Даже если это называют «возвратом», не отправляй деньги по реквизитам из чата и не трать их. Сообщи банку о подозрительном поступлении. Сохрани переписку, подключи взрослого и обратись в полицию. Угроза — дополнительный повод искать помощь."},{"type":"order","chapter":"03 / План помощи","time":"1 минута","title":"Сначала останови риск.","intro":"Собери разумный план для Саши: передвигай шаги стрелками. Первые два действия — срочные; последние два можно выполнять параллельно.","items":["Прекратить операции и не выполнять указания «куратора».","Самостоятельно связаться с банком; если доступ передан — попросить немедленно его защитить.","Сохранить переписку, контакты и сведения об операциях.","Подключить надёжного взрослого и обратиться в полицию."]},{"type":"choice","chapter":"04 / Последняя проверка","time":"1 минута","title":"Те же риски. Другая вывеска.","intro":"Теперь предложение выглядит солиднее: логотип, «договор» в PDF и название «тестировщик платежей».","person":"PaymentLab · учебное название","chat":["Нужно проверять переводы через свой личный счёт. Вознаграждение — за каждую операцию.","Карту никому не отдаёшь. Всё делаешь сам. Значит, риска нет!"],"options":["Если карта у меня, дропперства быть не может.","PDF-договор снимает риск. Можно начинать.","Название ничего не меняет: личный счёт используют для чужих операций. Отказываюсь."],"correct":2,"good":"Ты распознал схему даже под новой вывеской.","bad":"Карта может оставаться у владельца: выполнение неправомерных операций по чужому указанию тоже может повлечь ответственность.","lesson":"По статье 187 УК РФ ответственность связана с конкретными обстоятельствами, в том числе целью и характером операций. Сам факт обычного перевода не делает человека преступником. Но ни «договор», ни отсутствие передачи карты не легализуют сомнительную схему."},{"type":"reflect","chapter":"05 / Твой ответ","time":"1 минута","title":"Скажи это своими словами.","intro":"Напиши короткий отказ на предложение «просто провести деньги». Добавь безопасное действие, если человек уже ввязался."}];

scenarios.splice(6,0,{type:'evidence',chapter:'03 / Цифровой след',title:'Не стирай выход.',intro:'Саша готов просить помощи. Выбери три материала, которые стоит сохранить для банка и полиции. Не публикуй их в общем чате.',time:'1 минута',options:['Переписку с «куратором», включая угрозы.','Сведения о переводе из своего банковского приложения.','Контакты и адрес профиля отправителя.','Чужие паспортные данные из интернета «для проверки».','Пост с обвинениями и чужими реквизитами в школьном чате.'],correct:[0,1,2]});

function tone(){if(!sound)return;try{ctxAudio??=new(window.AudioContext||window.webkitAudioContext)();ctxAudio.resume();const o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.connect(g);g.connect(ctxAudio.destination);g.gain.setValueAtTime(.025,ctxAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+.13);o.frequency.value=660;o.start();o.stop(ctxAudio.currentTime+.15)}catch{}}
function soundToggle(){sound=!sound;$('sound').textContent=sound?'Звук: вкл.':'Звук: выкл.';tone()}
function timing(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function home(){ $('app').innerHTML=`<div class="grid hero fade"><section><span class="eyebrow">Квест-расследование · 10 класс · 10 минут</span><h1>Лёгкие деньги.<br><span class="blue">Тяжёлый след.</span></h1><p class="lead">Одно сообщение. Твоя карта.<br>Три истории, в которых ты можешь остановить чужую схему.</p><div class="tags"><span>Переписка</span><span>Входящий звонок</span><span>Улики</span><span>Разные последствия</span></div><p>Ты копишь на наушники. До цели осталось совсем немного — и именно сейчас незнакомец предлагает «подработку».</p><button class="primary" onclick="start()">Войти в историю <span>→</span></button><p class="small muted" style="margin-top:18px">Выбирай, исследуй, объясняй. Ошибки можно разобрать и исправить. Деньги и сообщения здесь — учебная симуляция.</p></section><aside class="phone preview"><div class="phonebar">16:42 <span>● ● ●</span></div><div class="locktime">После уроков.</div><div class="notification"><div class="small muted">СООБЩЕНИЯ · СЕЙЧАС</div><h3>Артём: есть тема 💬</h3><p>«За вечер заработаешь. Нужна только карта. Ты с нами?»</p></div><div class="goal"><span>Твоя цель: наушники</span><strong>Ещё 3 000 ₽</strong><div class="goalbar"><i></i></div></div><div class="screenwarning">Предложение выглядит как шанс.<br>Цена пока не видна.</div></aside></div><div class="tiles"><div class="card"><b>01 / Распознай</b><p>Найди давление и подмену смысла в сообщениях.</p></div><div class="card"><b>02 / Увидь</b><p>За каждым переводом может стоять человек, потерявший деньги.</p></div><div class="card"><b>03 / Останови</b><p>Собери безопасный план выхода и помощи.</p></div></div>${teacher()}`;updateHud()}
function start(){active=true;stage=0;last=Date.now();$('pause').classList.remove('hidden');render()}
function updateHud(){ $('progress').style.width=Math.max(0,stage/scenarios.length*100)+'%';$('inventory').textContent=`Улики: ${clues}/3`; }
function chat(d){return `<div class="phone"><div class="phonebar">УЧЕБНЫЙ ЧАТ <span>● ● ●</span></div><div class="sender"><div class="avatar">${d.person[0]}</div><div><b>${d.person}</b><div class="small muted">Симуляция переписки</div></div></div>${d.chat.map((t,i)=>`<div class="bubble" style="animation-delay:${i*.1}s">${t}</div>`).join('')}${stage===0?'<div class="pressure">⏱ «Место заберут» — тебя торопят.</div>':''}${stage===2?'<button class="call" onclick="openCall()">☎ Входящий от Димы · открыть</button>':''}<div class="small muted">Не вводи реальные банковские данные.</div></div>`}
function choiceButtons(d){return d.options.map((t,i)=>`<button class="choice" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b><span>${t}</span></button>`).join('')}
function render(){locked=false;selected=new Set();opened=new Set();branchUsed=false;updateHud();const d=scenarios[stage];let inner='';
if(d.type==='choice')inner=`<div class="grid"><aside>${chat(d)}</aside><section><span class="stepnum">ТВОЙ ХОД</span><h3>Что ты сделаешь?</h3><div id="choices">${choiceButtons(d)}</div><div id="branch"></div><p class="small muted">Можно пользоваться памяткой. Скорость не влияет на результат.</p></section></div>`;
if(d.type==='clues'||d.type==='evidence')inner=`<div class="card"><div class="casefile">${d.type==='clues'?'ДОСЬЕ 01 · СКРИНШОТ ПЕРЕПИСКИ':'ДОСЬЕ 03 · СОХРАНИТЬ ДОКАЗАТЕЛЬСТВА'}</div>${d.options.map((t,i)=>`<button class="choice" id="pick${i}" aria-pressed="false" onclick="pick(${i})"><b>+</b><span>${t}</span></button>`).join('')}<div class="actions"><button id="check" class="primary" disabled onclick="checkMulti()">${d.type==='clues'?'Зафиксировать уловки':'Собрать пакет помощи'}</button><span id="count" class="small muted">Выбрано 0 из 3</span></div></div>`;
if(d.type==='impact')inner=`<div class="impact-intro"><span class="eyebrow">Смена перспективы</span><p>До этого на экране были просто цифры. Теперь открой три карточки и узнай, что они означают для людей.</p></div><div class="tiles impacttiles">${['Ирина · потеряла 24 000 ₽','Владелец счёта · «просто помог»','Организатор · обещал лёгкость'].map((t,i)=>`<button class="impactcard" id="impact${i}" aria-expanded="false" onclick="revealImpact(${i})"><span class="huge">${['01','02','03'][i]}</span><h3>${t}</h3><span class="small">Нажми, чтобы увидеть последствия ↗</span><p id="impactText${i}"></p></button>`).join('')}</div><div class="card"><h3>Где возникает вред?</h3><div id="impactChoices" class="hidden">${choiceButtons(d)}</div><p id="impactHint" class="muted">Открой все три истории, затем выбери вывод.</p></div>`;
if(d.type==='order')inner=`<div class="grid"><div class="card dark"><span class="eyebrow">Саша · 16 лет</span><h2>«Я уже согласился.<br>Теперь страшно».</h2><p>Страх и стыд могут удерживать человека в схеме. Ему нужен выход, а не ещё один перевод.</p><div class="note">В учебном кейсе доступ к банку уже передан. Защита счёта — срочное действие.</div></div><div class="card"><h3>Собери план</h3><div id="orderList"></div><button class="primary" id="orderCheck" onclick="checkOrder()">Запустить план помощи</button></div></div>`;
if(d.type==='reflect')inner=`<div class="grid"><div class="card dark"><span class="eyebrow">Сообщение тебе</span><h2>«Да это один перевод.<br>Никто не узнает».</h2><p>Ответь так, чтобы не оставить места для давления. Добавь действие на случай, если человек уже ввязался.</p><div class="bubble">Хороший отказ не обязан быть длинным. И его не нужно оправдывать.</div></div><div class="card"><label for="reflection"><b>Твой ответ</b></label><textarea id="reflection" maxlength="700" placeholder="Я не буду… Если уже согласился, нужно…"></textarea><p class="small muted">Без имён, телефонов, номеров карт и личных историй.</p><details><summary>Опорные слова</summary><p>Не передаю доступ. Не провожу чужие деньги. Прекращаю операции. Обращаюсь в банк, к надёжному взрослому и в полицию.</p></details><button class="primary" onclick="finish()">Завершить расследование →</button><p id="error" role="status"></p></div></div>`;
$('app').innerHTML=`<div class="fade"><div class="meta"><span>${outcome.map((t,i)=>`<span class="dot ${i===stage?'current':i<stage?'done':''}" title="${t}"></span>`).join('')}</span><span>Этап ${stage+1}/${scenarios.length} · ~${d.time}</span></div><span class="eyebrow">${d.chapter}</span><h2 tabindex="-1" id="heading">${d.title}</h2><p class="lead">${d.intro}</p>${inner}<div id="feedback" aria-live="polite"></div></div>`;if(d.type==='order')renderOrder();$('heading').focus();window.scrollTo(0,0);tone()}
function record(answer,ok,lesson){answers.push({stage,title:scenarios[stage].title,answer,ok,lesson,branchRisk:stage===0&&branchRisk})}
function feedback(ok,title,lesson){locked=true;document.querySelectorAll('#app .choice,#app .order button,#check,#orderCheck').forEach(e=>e.disabled=true);$('feedback').innerHTML=`<section class="feedback ${ok?'':'warn'}"><span class="eyebrow">${ok?'Связь разорвана':'Разбор решения'}</span><h3>${title}</h3><p>${lesson}</p><div class="takeaway"><b>Что взять с собой:</b> ${stage<2?labels[0]:stage<4?labels[1]:labels[2]}</div><button class="primary" onclick="next()">Дальше по истории →</button></section>`;$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function choose(i){if(locked)return;const d=scenarios[stage];if(stage===0&&i!==d.correct&&!branchUsed){branchUsed=true;branchRisk=true;$('choices').innerHTML='';$('branch').innerHTML=`<div class="card dark"><span class="small muted">ТВОЙ ВЫБОР</span><p>${d.options[i]}</p><div class="bubble">${i===0?'«Паспорт скину. Только сначала дай доступ к банковскому приложению — для оформления».':'«Отлично. Один перевод — и дальше будет проще. Только никому не рассказывай». '}</div><h3>Предложение стало опаснее.</h3><button class="choice" onclick="branchEnd(false)">Продолжить: я уже почти согласился.</button><button class="choice" onclick="branchEnd(true)">Остановиться: прошлый ответ ни к чему меня не обязывает.</button></div>`;tone();return}const ok=i===d.correct;record(d.options[i],ok,d.lesson);if(stage===0&&!ok)branchRisk=true;feedback(ok,ok?d.good:d.bad,d.lesson)}
function branchEnd(stopped){if(locked)return;const lesson=stopped?'Ты изменил решение до передачи доступа. Это полезный навык: согласие в переписке не обязывает участвовать. Паспорт может быть чужим; первая небольшая операция не делает схему безопасной.':'В симуляции контакт получил бы доступ к твоему счёту. Он может использовать его для чужих операций; обещанное вознаграждение не компенсирует риск. Нужны срочная связь с банком и помощь взрослого. Реальные операции здесь не выполняются.';record(stopped?'Сначала заинтересовался, затем остановился':'Продолжил после просьбы дать доступ',false,lesson);feedback(stopped,stopped?'Ты успел сказать «стоп».':'Это не заработок. Твой счёт стал инструментом.',lesson)}
function openCall(){showModal('Входящий звонок · Дима',`<div class="call-avatar">Д</div><p class="lead">«Ты что, меня подставляешь? Я уже пообещал, что деньги примут. Сделай по-дружески!»</p><p>Это текстовая симуляция звонка. Обрати внимание: Дима объясняет свою обиду, но не происхождение денег.</p><p><b>Вопрос:</b> может ли дружба заменить проверку операции?</p>`);tone()}
function pick(i){if(locked)return;if(selected.has(i))selected.delete(i);else if(selected.size<3)selected.add(i);scenarios[stage].options.forEach((_,j)=>{$('pick'+j).classList.toggle('selected',selected.has(j));$('pick'+j).setAttribute('aria-pressed',selected.has(j))});$('count').textContent=`Выбрано ${selected.size} из 3`;$('check').disabled=selected.size!==3}
function checkMulti(){if(locked||selected.size!==3)return;const d=scenarios[stage],ok=d.correct.every(i=>selected.has(i));const lesson=d.type==='clues'?'Уловки: личный счёт для чужих платежей, требование секретности и искусственная срочность. Мессенджер и день оплаты сами по себе не доказывают обман. Важно, что именно от тебя хотят.':'Сохрани переписку, сведения об операциях и контакты отправителя. Передавай их банку и полиции через проверенные каналы, а не всему классу. Не собирай чужие документы и не устраивай публичное расследование.';if(d.type==='clues')clues=3;updateHud();record([...selected].map(i=>d.options[i]).join('; '),ok,lesson);feedback(ok,ok?'Досье собрано.':'Посмотри, какие данные действительно важны.',lesson)}
function revealImpact(i){if(opened.has(i))return;opened.add(i);const text=['Ирина перевела деньги, поверив взломанному аккаунту знакомой. Теперь ей не хватает на аренду. Помимо денег, потеряны время и чувство безопасности. Это вымышленный кейс, но вред вполне реальный по своему характеру.','На счёте остаётся след операций. Возможны банковские ограничения и разбирательство; при наличии состава преступления — ответственность. «Я только переслал» не отменяет роли в цепочке.','Обещавший лёгкость может перестать отвечать. А объясняться с банком и правоохранительными органами придётся владельцу счёта. Обещания «всё беру на себя» не дают защиты.'];$('impactText'+i).textContent=text[i];$('impact'+i).classList.add('revealed');$('impact'+i).setAttribute('aria-expanded','true');if(opened.size===3){$('impactChoices').classList.remove('hidden');$('impactHint').textContent='Ты увидел все стороны. Какой вывод точнее?'}tone()}
function renderOrder(){const d=scenarios[stage];$('orderList').innerHTML=order.map((id,i)=>`<div class="order"><b>${i+1}</b><span>${d.items[id]}</span><button ${i===0?'disabled':''} aria-label="Шаг ${i+1} вверх" onclick="move(${i},-1)">↑</button><button ${i===3?'disabled':''} aria-label="Шаг ${i+1} вниз" onclick="move(${i},1)">↓</button></div>`).join('')}
function move(i,delta){if(locked)return;const j=i+delta;if(j<0||j>3)return;[order[i],order[j]]=[order[j],order[i]];renderOrder()}
function checkOrder(){if(locked)return;const d=scenarios[stage],ok=order[0]===0&&order[1]===1;const lesson='Сначала останови операции и самостоятельно свяжись со своим банком, чтобы защитить доступ. Сохранение доказательств и обращение к взрослому и в полицию можно совмещать. Не откладывай защиту счёта ради скриншотов. При непосредственной угрозе — 112.';record(order.map(i=>d.items[i]).join(' → '),ok,lesson);feedback(ok,ok?'План защиты запущен.':'Сначала — прекратить риск и защитить счёт.',lesson)}
function next(){stage++;render()}
function finish(){reflection=$('reflection').value.trim();if(reflection.length<15){$('error').textContent='Напиши хотя бы короткую фразу отказа и действие помощи (от 15 символов).';return}active=false;stage=scenarios.length;$('pause').classList.add('hidden');updateHud();const score=answers.filter(a=>a.ok).length;const ending=branchRisk?'Ты увидел, как втягивают в схему.':'Ты прервал первое вовлечение.';$('app').innerHTML=`<span class="eyebrow">Расследование завершено</span><h2>${ending}<br><span class="blue">Теперь у тебя есть план.</span></h2><p class="lead">Дропперство помогает уводить чужие деньги. Человек за переводом теряет средства, а владелец счёта принимает на себя риск. Остановиться и обратиться за помощью можно даже после ошибки.</p><div class="tiles"><div class="card"><div class="metric">${score}/8</div><p>заданий без ошибки<br><span class="small muted">первое рискованное решение тоже учитывается</span></p></div><div class="card"><div class="metric">${timing(600-remaining)}</div><p>время игры<br><span class="small muted">без пауз, до 10 минут</span></p></div><div class="card"><div class="metric">3</div><p>главных правила<br><span class="small muted">доступ · переводы · помощь</span></p></div></div><div class="grid"><div class="card"><h3>Твой ответ на давление</h3><p style="white-space:pre-wrap">${esc(reflection)}</p><p class="small muted">Сверь: есть отказ от передачи доступа или чужих переводов? Есть безопасный шаг помощи? Текст не оценивается автоматически.</p></div><div class="card"><h3>Не поздно остановиться</h3><p>Не продолжай операции. Самостоятельно свяжись со своим банком. Сохрани доказательства, подключи надёжного взрослого и полицию.</p><p class="small muted">Обращение за помощью не гарантирует освобождения от ответственности. Но продолжение схемы увеличивает вред.</p></div></div><details open><summary>Твой маршрут: решения и последствия</summary>${answers.map(a=>`<div class="summaryrow"><b>${a.ok?'✓':'↺'} ${a.title}</b><p class="small">${esc(a.answer)}</p><p class="small muted">${a.lesson}</p></div>`).join('')}</details><div class="actions no-print"><button class="primary" onclick="download()">Скачать мой разбор</button><button class="secondary" onclick="window.print()">Распечатать</button><button class="quiet" onclick="restart()">Другой маршрут</button></div>${sources()}${teacher()}`;window.scrollTo(0,0)}
let modalFocus=null,modalPaused=false;function showModal(title,body){modalFocus=document.activeElement;modalPaused=paused;paused=true;last=Date.now();$('modal').innerHTML=`<div class="card modalcard"><h2>${title}</h2>${body}<button class="primary" onclick="closeModal()">Продолжить</button></div>`;$('modal').classList.remove('hidden');$('modal').querySelector('button').focus()}
function closeModal(){paused=modalPaused;last=Date.now();$('modal').classList.add('hidden');if(modalFocus)modalFocus.focus()}
function pauseGame(){if(active)showModal('Пауза.','<p>Таймер остановлен. Решения можно принимать спокойно.</p>')}
function help(){showModal('Три правила.',`<p><b>Не передавай доступ:</b> карту, пароли, коды и банковское приложение.</p><p><b>Не проводи чужие деньги ради комиссии.</b> Неожиданный перевод не трать и не отправляй по реквизитам из чата — обратись в свой банк.</p><p><b>Если уже вовлечён:</b> останови операции, защити доступ через банк, сохрани доказательства, подключи надёжного взрослого и полицию. При непосредственной угрозе — 112.</p>`)}
function sources(){return `<details><summary>Официальные источники и правовые пояснения</summary><p class="small">Проверено 11.10.2026. Все персонажи и эпизоды вымышлены. Интернет нужен только для ссылок.</p><ul><li><a href="https://cbr.ru/press/regevent/?id=46501" target="_blank" rel="noopener">Банк России: вовлечение в дропперство</a></li><li><a href="https://cbr.ru/faq/information_security/" target="_blank" rel="noopener">Банк России: защита от мошенничества</a></li><li><a href="https://epp.genproc.gov.ru/ru/proc_71/activity/legal-education/explain/e8398932/" target="_blank" rel="noopener">Прокуратура: статья 187 УК РФ</a></li></ul><p class="small">С 5 июля 2025 года действуют изменения статьи 187 УК РФ. Для ряда деяний значение имеют корыстная заинтересованность и неправомерный характер операций. Обычный перевод сам по себе не означает преступление. Конкретную ответственность определяют по обстоятельствам и доказательствам; автоматического наказания за «неправильный ответ» не существует.</p></details>`}
function teacher(){return `<details class="no-print"><summary>Учителю · как провести за 10 минут</summary><p><b>0–1 мин:</b> ввод. <b>1–3 мин:</b> предложение, ветка решения, три уловки. <b>3–5 мин:</b> друг и последствия для людей. <b>5–8 мин:</b> подозрительный перевод, план, доказательства. <b>8–9 мин:</b> новая маскировка и отказ. <b>9–10 мин:</b> итог.</p><p>В паре один читает, другой объясняет решение. Не превращайте баллы в отметку: изменение опасного решения — тоже важный результат. Обсудите: «Кто платит за лёгкость?», «Как помочь другу, не отдавая счёт?»</p><p>Не просите учеников публично рассказывать о собственном опыте. Все ответы хранятся только в памяти вкладки, не отправляются учителю или на сервер и сбрасываются при обновлении. Есть скачивание личного разбора. Для открытия игры на телефоне используйте браузер и ссылку сайта; встроенный просмотрщик файла может не запускать JavaScript.</p></details>`}
function download(){const text='НЕ ТВОЙ ПЕРЕВОД — личный маршрут\n\n'+answers.map(a=>(a.ok?'Верно':'Разобрать')+' | '+a.title+'\nМой выбор: '+a.answer+'\nВывод: '+a.lesson).join('\n\n')+'\n\nМой ответ:\n'+reflection;const blob=new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Moy_marshrut.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restart(){if(!confirm('Ответы сбросятся. Начать другой маршрут?'))return;stage=-1;remaining=600;active=false;answers=[];locked=false;selected=new Set();order=[2,0,3,1];opened=new Set();reflection='';branchUsed=false;branchRisk=false;clues=0;$('clock').textContent='10:00';$('timeup').classList.add('hidden');home();window.scrollTo(0,0)}
setInterval(()=>{const now=Date.now();if(active&&!paused){remaining=Math.max(0,remaining-(now-last)/1000);$('clock').textContent=timing(remaining);if(!remaining)$('timeup').classList.remove('hidden')}last=now},250);
document.addEventListener('keydown',e=>{if($('modal').classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){e.preventDefault();$('modal').querySelector('button').focus()}});
home();
</script></body></html>
